apiVersion: nvidia.com/v1beta2
kind: DynamoGraphDeploymentRequest
metadata:
  name: aisimulate-vllm
spec:
  model:
    name: Qwen/Qwen3-32B
  backends:
    - vllm
  hardware:
    gpu:
      sku: h200_sxm
      budget: 2
  workload:
    static:
      inputTokens: 1024
      outputTokens: 128
      load:
        concurrency: 10
  objective:
    mode: Optimize
    metric: ThroughputPerGPU
    sla: {}
  aisimulate:
    inputOverrides:
      engine:
        mode: aggregated
        context_length: 32768
        workers:
          prefill: null
          decode: null
      traffic:
        stop:
          requests: 8
      optimizer:
        algorithm: random
        max_trials: 1
        parallelism: 1
        candidate_timeout_seconds: 120
  recommendation:
    maxCandidates: 1
